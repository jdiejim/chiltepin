name: release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # push the version-bump commit + tags back to main
  id-token: write # npm provenance (signed build attestation on the package page)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the version-bump commit fast-forwards
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      # The separate CI workflow runs concurrently. Gate publishing here too.
      - run: pnpm verify
      - run: pnpm publint
      - run: pnpm attw

      # Direct publish (no "Version Packages" PR): when a changeset is present,
      # version + publish + push the bump and tags back to main in one shot.
      # The bump commit carries [skip ci] AND is pushed with GITHUB_TOKEN, so it
      # does not re-trigger this workflow.
      - name: Version, publish, and push
        run: |
          set -euo pipefail
          # This run may have queued behind another release that already
          # versioned and pushed. Start from the current main, not from the
          # commit that triggered the run, so the changesets seen here are
          # exactly the ones still pending.
          git pull --rebase origin main
          if [ -z "$(ls .changeset/*.md 2>/dev/null | grep -v README.md || true)" ]; then
            echo "No changesets — nothing to release."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm changeset version
          pnpm release            # pnpm -r build && changeset publish (creates tags)
          git add -A
          git commit -m "chore: version packages [skip ci]"
          # main may have moved while publishing: rebase the bump commit onto it
          # rather than dropping it, and fail loudly if that is not possible.
          git pull --rebase origin main
          git push origin HEAD:main
          git push origin --tags
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      # Guard: changeset publish can skip a package yet exit 0 — fail loudly if
      # the registry doesn't match the (now pre-versioned) tree.
      - run: node scripts/verify-published.mjs
