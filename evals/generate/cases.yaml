# Generation eval — end-to-end scenarios across the block families.
#
# A fresh agent gets ONE request, the installed skill, and a working `chiltepin`
# (through `npx -y chiltepin`). It follows the skill's fast path in full: pick,
# `chiltepin block`, write, `chiltepin check`, fix. Unlike evals/write, the agent MAY run
# the CLI — that is the product. The first draft is captured before any check
# so first-write quality and final quality are both scored.
#
# Each case: the request (never names a block), the block types that carry
# the main answer (`expected` → full marks, `acceptable` → half, `wrong` → a
# keyword trap), and `family` for the coverage table. Keep ids stable; add new
# cases at the end.

- id: login-flow
  family: flows
  request: How the login flow works across the SPA, the auth service, and Google.
  expected: [sequence]
  acceptable: [swimlane]
  wrong: [flow, steps, c4]

